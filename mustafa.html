<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Mustafa Adventure - Extended Level 1</title>
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes"> 
<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}
 
body{
background:#000;
overflow:hidden;
font-family:Arial;
width:100vw;
height:100vh;
touch-action:none;
}

canvas{
display:block;
margin:auto;
background:linear-gradient(#55c8ff,#dff8ff);
width:100vw;
height:100vh;
touch-action:none;
} 

.ctrl-btn {
position: absolute;
background: rgba(0, 0, 0, 0.5);
border: 2px solid white;
color: white;
font-size: 26px;
font-weight: bold;
border-radius: 14px;
display: flex;
align-items: center;
justify-content: center;
z-index: 100;
user-select: none;
-webkit-user-select: none;
box-shadow: 0 4px 10px rgba(0,0,0,0.5);
}

#btn-left { left: 15px; bottom: 15px; width: 75px; height: 75px; }
#btn-right { left: 100px; bottom: 15px; width: 75px; height: 75px; }
#btn-jump { right: 20px; bottom: 50px; width: 110px; height: 75px; background: rgba(0, 180, 0, 0.7); }
#btn-rotate { top: 15px; right: 15px; width: 100px; height: 40px; font-size: 15px; background: rgba(220, 50, 50, 0.8); border-radius: 8px; z-index: 101; }
</style>
</head>
 
<body>
<canvas id="game" width="1000" height="550"></canvas>

<button class="ctrl-btn" id="btn-left">←</button>
<button class="ctrl-btn" id="btn-right">→</button>
<button class="ctrl-btn" id="btn-jump">JUMP</button>
<button class="ctrl-btn" id="btn-rotate">🔄 ROTATE</button>
 
<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

let player={
x:120,
y:380,
w:45,
h:60,
dx:0,
dy:0,
speed:6,
jump:-15,
ground:false,
checkpointX: 120,
checkpointY: 380
};
 
const gravity=0.8;
const keys={};

let mobileLeft = false;
let mobileRight = false;
let mobileJump = false;

const bLeft = document.getElementById("btn-left");
const bRight = document.getElementById("btn-right");
const bJump = document.getElementById("btn-jump");
const bRotate = document.getElementById("btn-rotate");

bRotate.addEventListener("click", ()=>{
if (!document.fullscreenElement) {
document.documentElement.requestFullscreen().then(() => {
if (screen.orientation && screen.orientation.lock) {
screen.orientation.lock("landscape").catch(err => {});
}
}).catch(err => {});
} else {
if (document.exitFullscreen) {
document.exitFullscreen();
}
}
});

bLeft.addEventListener("touchstart", (e)=>{ mobileLeft = true; e.preventDefault(); });
bLeft.addEventListener("touchend", (e)=>{ mobileLeft = false; e.preventDefault(); });
bLeft.addEventListener("mousedown", ()=>{ mobileLeft = true; });
bLeft.addEventListener("mouseup", ()=>{ mobileLeft = false; });

bRight.addEventListener("touchstart", (e)=>{ mobileRight = true; e.preventDefault(); });
bRight.addEventListener("touchend", (e)=>{ mobileRight = false; e.preventDefault(); });
bRight.addEventListener("mousedown", ()=>{ mobileRight = true; });
bRight.addEventListener("mouseup", ()=>{ mobileRight = false; });

bJump.addEventListener("touchstart", (e)=>{
if(player.ground){
player.dy = player.jump;
player.ground = false;
}
e.preventDefault();
});
bJump.addEventListener("mousedown", ()=>{
if(player.ground){
player.dy = player.jump;
player.ground = false;
}
});

canvas.addEventListener("click", function(e){
if(!levelComplete) return;

const rect=canvas.getBoundingClientRect();
const mx=e.clientX-rect.left+cameraX;
const my=e.clientY-rect.top;

if(mx>cameraX+350 && mx<cameraX+500 && my>320 && my<370){
location.reload();
}
if(mx>cameraX+540 && mx<cameraX+740 && my>320 && my<370){
alert("Level 2 Coming Soon...");
}
});

document.addEventListener("keydown", e=>{ keys[e.key]=true; });
document.addEventListener("keyup", e=>{ keys[e.key]=false; });

function respawnPlayer(){
lives--;
player.x = player.checkpointX;
player.y = player.checkpointY;
player.dy = 0;
if(lives <= 0){
alert("GAME OVER");
location.reload();
}
}

function update(){
player.dx = 0;

if(keys["ArrowLeft"] || keys["a"] || mobileLeft){
player.dx = -player.speed;
}
if(keys["ArrowRight"] || keys["d"] || mobileRight){
player.dx = player.speed;
}

if((keys["ArrowUp"] || keys["w"] || keys[" "] || mobileJump) && player.ground){
player.dy = player.jump;
player.ground = false;
mobileJump = false;
}
 
player.x += player.dx;
player.dy += gravity;
player.ground = false;
player.y += player.dy;

if(player.y + player.h >= 500){
player.y = 500 - player.h;
player.dy = 0;
player.ground = true;
}

// Normal Platforms
platforms.forEach(p=>{
if(
player.x + player.w > p.x &&
player.x < p.x + p.w &&
player.y + player.h >= p.y &&
player.y + player.h <= p.y + 20 &&
player.dy >= 0
){
player.y = p.y - player.h;
player.dy = 0;
player.ground = true;
}
});

// Moving Platforms update & collision
movingPlatforms.forEach(mp=>{
mp.x += mp.dir * mp.speed;
if(mp.x < mp.minX || mp.x > mp.maxX) mp.dir *= -1;

if(
player.x + player.w > mp.x &&
player.x < mp.x + mp.w &&
player.y + player.h >= mp.y &&
player.y + player.h <= mp.y + 20 &&
player.dy >= 0
){
player.y = mp.y - player.h;
player.dy = 0;
player.ground = true;
player.x += mp.dir * mp.speed; // carry player along moving platform
}
});

// Spikes Collision (Hazards)
spikes.forEach(s=>{
if(
player.x + player.w > s.x + 5 &&
player.x < s.x + s.w - 5 &&
player.y + player.h > s.y + 10
){
respawnPlayer();
}
});

// Checkpoints
checkpoints.forEach(cp=>{
if(!cp.reached && player.x > cp.x){
cp.reached = true;
player.checkpointX = cp.x;
player.checkpointY = 380;
}
});

// Coin Collection Check
coins.forEach(c=>{
if(!c.collected){
let up = Math.sin(Date.now() * 0.004 + c.x) * 5;
let coinY = c.y + up;
if(
player.x + player.w > c.x - 15 &&
player.x < c.x + 15 &&
player.y + player.h > coinY - 15 &&
player.y < coinY + 15
){
c.collected = true;
score += 10;
}
}
});

// Hearts Collection (Extra Life)
hearts.forEach(h=>{
if(!h.collected){
if(
player.x + player.w > h.x - 15 &&
player.x < h.x + 15 &&
player.y + player.h > h.y - 15 &&
player.y < h.y + 15
){
h.collected = true;
lives++;
}
}
});

// Ground Enemies
enemies.forEach(e=>{
if(e.dead) return;
e.x += 2 * e.dir;
if(e.x < e.startX - 120) e.dir = 1;
if(e.x > e.startX + 120) e.dir = -1;

if(
player.x < e.x + e.w &&
player.x + player.w > e.x &&
player.y < e.y + e.h &&
player.y + player.h > e.y
){
if(player.dy > 0 && player.y + player.h < e.y + 15){
e.dead = true;
player.dy = -12;
score += 50;
}else{
respawnPlayer();
}
}
}); 

// Flying Enemies
flyingEnemies.forEach(fe=>{
if(fe.dead) return;
fe.x += 2.5 * fe.dir;
if(fe.x < fe.startX - 150) fe.dir = 1;
if(fe.x > fe.startX + 150) fe.dir = -1;
fe.y = fe.startY + Math.sin(Date.now() * 0.006 + fe.x) * 40;

if(
player.x < fe.x + fe.w &&
player.x + player.w > fe.x &&
player.y < fe.y + fe.h &&
player.y + player.h > fe.y
){
if(player.dy > 0 && player.y + player.h < fe.y + 15){
fe.dead = true;
player.dy = -12;
score += 80;
}else{
respawnPlayer();
}
}
});

if(
player.x + player.w > finishFlag.x &&
player.x < finishFlag.x + finishFlag.w &&
!levelComplete
){
levelComplete = true;
}
}

let cameraX = 0;

// Extended Game Elements
const coins=[
{x:500,y:450,collected:false},
{x:650,y:450,collected:false},
{x:820,y:450,collected:false},
{x:980,y:450,collected:false},
{x:1300,y:450,collected:false},
{x:1500,y:380,collected:false},
{x:1800,y:450,collected:false},
{x:2100,y:380,collected:false},
{x:2450,y:450,collected:false},
{x:2700,y:350,collected:false},
{x:2950,y:450,collected:false},
{x:3300,y:380,collected:false},
{x:3600,y:450,collected:false},
{x:3900,y:360,collected:false}
];

const hearts=[
{x:1450,y:240,collected:false},
{x:3100,y:300,collected:false}
];

const checkpoints=[
{x:2000, reached:false}
];

const platforms=[
{x:700,y:430,w:150,h:20},
{x:1050,y:360,w:150,h:20},
{x:1450,y:300,w:180,h:20},
{x:2300,y:420,w:160,h:20},
{x:2650,y:380,w:140,h:20},
{x:3200,y:410,w:180,h:20},
{x:3700,y:370,w:150,h:20}
];

const movingPlatforms=[
{x:1850,y:360,w:130,h:20,minX:1750,maxX:2050,dir:1,speed:2},
{x:3450,y:330,w:130,h:20,minX:3350,maxX:3650,dir:-1,speed:2.5}
];

const spikes=[
{x:1150,y:475,w:50,h:25},
{x:2150,y:475,w:60,h:25},
{x:3050,y:475,w:70,h:25}
];

const clouds=[
{x:150,y:80},
{x:500,y:120},
{x:900,y:70},
{x:1400,y:100},
{x:2000,y:90},
{x:2600,y:60},
{x:3200,y:110},
{x:3800,y:80},
{x:4300,y:100}
];

const mountains=[
{x:0,h:180},
{x:450,h:240},
{x:900,h:190},
{x:1400,h:260},
{x:1900,h:200},
{x:2500,h:230},
{x:3100,h:170},
{x:3700,h:220},
{x:4200,h:190}
];

const trees=[
{x:300},
{x:900},
{x:1700},
{x:2300},
{x:3000},
{x:3800}
];
 
let score=0;
let lives=3;
let levelComplete=false;

const enemies=[
{x:900,startX:900,y:465,w:40,h:40,dir:1,dead:false},
{x:1700,startX:1700,y:465,w:40,h:40,dir:-1,dead:false},
{x:2800,startX:2800,y:465,w:40,h:40,dir:1,dead:false},
{x:3500,startX:3500,y:465,w:40,h:40,dir:-1,dead:false}
];

const flyingEnemies=[
{x:1350,startX:1350,startY:200,y:200,w:35,h:30,dir:1,dead:false},
{x:2600,startX:2600,startY:180,y:180,w:35,h:30,dir:-1,dead:false}
];

const finishFlag={
x:4100,
y:340,
w:20,
h:160
};

function draw(){
cameraX += (player.x - 250 - cameraX) * 0.08;
 
ctx.clearRect(0, 0, canvas.width, canvas.height);
ctx.save();
ctx.translate(-cameraX, 0);

ctx.fillStyle = "#87CEEB";
ctx.fillRect(cameraX, 0, 5500, 500);                
ctx.fillStyle = "#79d45d";
ctx.fillRect(0, 500, 5500, 50);

// Mountains
ctx.fillStyle = "#8ea5b8";
mountains.forEach(m=>{
ctx.beginPath();
ctx.moveTo(m.x, 500);
ctx.lineTo(m.x + 170, 500 - m.h);
ctx.lineTo(m.x + 340, 500);
ctx.closePath();
ctx.fill();
});

// Clouds
ctx.fillStyle = "white";
clouds.forEach(c=>{
let cx = c.x - cameraX * 0.25;
ctx.beginPath();
ctx.arc(cx, 80, 22, 0, Math.PI * 2);
ctx.arc(cx + 20, 70, 24, 0, Math.PI * 2);
ctx.arc(cx + 45, 82, 20, 0, Math.PI * 2);
ctx.fill();
});

// Trees
trees.forEach(tree=>{
ctx.fillStyle = "#7a4516";
ctx.fillRect(tree.x, 410, 20, 90);
ctx.fillStyle = "#0c8f2d";
ctx.beginPath();
ctx.arc(tree.x + 10, 390, 40, 0, Math.PI * 2);
ctx.fill();
});

// Checkpoint Flag Poles
checkpoints.forEach(cp=>{
ctx.fillStyle = "#555";
ctx.fillRect(cp.x, 380, 8, 120);
ctx.fillStyle = cp.reached ? "#00FF00" : "#FF0000";
ctx.beginPath();
ctx.moveTo(cp.x + 8, 380);
ctx.lineTo(cp.x + 45, 400);
ctx.lineTo(cp.x + 8, 420);
ctx.closePath();
ctx.fill();
});

// Spikes Drawing
ctx.fillStyle = "#c0392b";
spikes.forEach(s=>{
for(let i=0; i<s.w; i+=12){
ctx.beginPath();
ctx.moveTo(s.x + i, 500);
ctx.lineTo(s.x + i + 6, 500 - s.h);
ctx.lineTo(s.x + i + 12, 500);
ctx.closePath();
ctx.fill();
}
});

// Platforms
ctx.fillStyle = "#704214";
platforms.forEach(p=>{
ctx.fillRect(p.x, p.y, p.w, p.h);
});

// Moving Platforms
ctx.fillStyle = "#8E44AD";
movingPlatforms.forEach(mp=>{
ctx.fillRect(mp.x, mp.y, mp.w, mp.h);
});

// Ground Enemies Drawing
enemies.forEach(e=>{
if(e.dead) return;
let bounce = Math.sin(Date.now() * 0.01 + e.x) * 3;

ctx.fillStyle = "#7dff3a";
ctx.beginPath();
ctx.arc(e.x + 20, e.y + 20 + bounce, 20, 0, Math.PI * 2);
ctx.fill();

ctx.fillStyle = "#c8ff88";
ctx.beginPath();
ctx.arc(e.x + 20, e.y + 25 + bounce, 12, 0, Math.PI * 2);
ctx.fill();

ctx.fillStyle = "#fff";
ctx.beginPath();
ctx.arc(e.x + 13, e.y + 14 + bounce, 4, 0, Math.PI * 2);
ctx.fill();
ctx.beginPath();
ctx.arc(e.x + 27, e.y + 14 + bounce, 4, 0, Math.PI * 2);
ctx.fill();

ctx.fillStyle = "#000";
ctx.beginPath();
ctx.arc(e.x + 13, e.y + 14 + bounce, 1.5, 0, Math.PI * 2);
ctx.fill();
ctx.beginPath();
ctx.arc(e.x + 27, e.y + 14 + bounce, 1.5, 0, Math.PI * 2);
ctx.fill();

ctx.strokeStyle = "#000";
ctx.lineWidth = 2;
ctx.beginPath();
ctx.arc(e.x + 20, e.y + 24 + bounce, 7, 0, Math.PI);
ctx.stroke();
});

// Flying Enemies Drawing
flyingEnemies.forEach(fe=>{
if(fe.dead) return;
ctx.fillStyle = "#E74C3C";
ctx.beginPath();
ctx.arc(fe.x + 17, fe.y + 15, 16, 0, Math.PI * 2);
ctx.fill();
// Wings
ctx.fillStyle = "#F1C40F";
let wing = Math.sin(Date.now() * 0.03) * 10;
ctx.fillRect(fe.x - 5, fe.y + 5 + wing, 10, 8);
ctx.fillRect(fe.x + 25, fe.y + 5 + wing, 10, 8);
});

// Finish Flag
ctx.fillStyle = "#777";
ctx.fillRect(finishFlag.x, finishFlag.y, finishFlag.w, finishFlag.h);

ctx.fillStyle = "red";
ctx.beginPath();
ctx.moveTo(finishFlag.x + 20, finishFlag.y);
ctx.lineTo(finishFlag.x + 90, finishFlag.y + 30);
ctx.lineTo(finishFlag.x + 20, finishFlag.y + 60);
ctx.closePath();
ctx.fill();               

// Animated Coins
coins.forEach(c=>{
if(!c.collected){
let glow = 8 + Math.sin(Date.now() * 0.008 + c.x) * 3;
let up = Math.sin(Date.now() * 0.004 + c.x) * 5;

ctx.beginPath();
ctx.fillStyle = "rgba(255,255,0,0.25)";
ctx.arc(c.x, c.y + up, glow + 10, 0, Math.PI * 2);
ctx.fill();

ctx.beginPath();
ctx.fillStyle = "#FFD700";
ctx.arc(c.x, c.y + up, 10, 0, Math.PI * 2);
ctx.fill();

ctx.beginPath();
ctx.fillStyle = "#FFF176";
ctx.arc(c.x, c.y + up, 6, 0, Math.PI * 2);
ctx.fill();

ctx.fillStyle = "white";
ctx.beginPath();
ctx.arc(c.x - 3, c.y - 3 + up, 2, 0, Math.PI * 2);
ctx.fill();
}
});

// Hearts Drawing
hearts.forEach(h=>{
if(!h.collected){
ctx.fillStyle = "#FF0000";
ctx.beginPath();
ctx.arc(h.x - 5, h.y - 5, 8, Math.PI, 0, false);
ctx.arc(h.x + 5, h.y - 5, 8, Math.PI, 0, false);
ctx.lineTo(h.x, h.y + 10);
ctx.closePath();
ctx.fill();
}
});

ctx.fillStyle = "#7b4a1b";
ctx.fillRect(0, 495, 5500, 5);
 
// ===== MUSTAFA CHARACTER =====
let walk = Math.sin(Date.now() * 0.015) * 8;

// Head
ctx.fillStyle = "#ffd39b";
ctx.beginPath();
ctx.arc(player.x + 22, player.y + 12, 12, 0, Math.PI * 2);
ctx.fill();

// Hair
ctx.fillStyle = "#111";
ctx.beginPath();
ctx.arc(player.x + 22, player.y + 7, 12, Math.PI, 0);
ctx.fill();

// Eyes
ctx.fillStyle = "#000";
ctx.beginPath();
ctx.arc(player.x + 18, player.y + 11, 2, 0, Math.PI * 2);
ctx.fill();
ctx.beginPath();
ctx.arc(player.x + 26, player.y+11, 2, 0, Math.PI * 2);
ctx.fill();

// Body
ctx.fillStyle = "#1e88e5";
ctx.fillRect(player.x + 12, player.y + 24, 20, 25);

// Arms
ctx.strokeStyle = "#ffd39b";
ctx.lineWidth = 4;
ctx.beginPath();
ctx.moveTo(player.x + 12, player.y + 30);
ctx.lineTo(player.x + 2, player.y + 40 + walk/4);
ctx.stroke();

ctx.beginPath();
ctx.moveTo(player.x + 32, player.y + 30);
ctx.lineTo(player.x + 42, player.y + 40 - walk/4);
ctx.stroke();

// Legs & Feet
ctx.strokeStyle = "#222";
ctx.lineWidth = 5;

ctx.beginPath();
ctx.moveTo(player.x + 17, player.y + 49);
ctx.lineTo(player.x + 12, player.y + 62 + walk);
ctx.stroke();

ctx.beginPath();
ctx.moveTo(player.x + 27, player.y + 49);
ctx.lineTo(player.x + 32, player.y + 62 - walk);
ctx.stroke();

// UI Text
ctx.font = "24px Arial";
ctx.fillStyle = "#fff";
ctx.fillText("Mustafa Adventure - Extended Level 1", cameraX + 20, 35);

ctx.font = "18px Arial";
ctx.fillText("Move : ← →   Jump : SPACE", cameraX + 20, 65);

ctx.font = "20px Arial";
ctx.fillText("Score : " + score, cameraX + 20, 95);
ctx.fillText("Lives : " + lives, cameraX + 20, 125);

if(levelComplete){
ctx.fillStyle = "rgba(0,0,0,0.6)";
ctx.fillRect(cameraX, 0, 1000, 550);

ctx.fillStyle = "yellow";
ctx.font = "60px Arial";
ctx.fillText("LEVEL COMPLETE!", cameraX + 250, 220);

ctx.font = "30px Arial";
ctx.fillStyle = "white";
ctx.fillText("Congratulations!", cameraX + 330, 280);

ctx.fillStyle = "#2196F3";
ctx.fillRect(cameraX + 350, 320, 150, 50);
ctx.fillStyle = "white";
ctx.font = "24px Arial";
ctx.fillText("Restart", cameraX + 385, 352);

ctx.fillStyle = "#4CAF50";
ctx.fillRect(cameraX + 540, 320, 200, 50);
ctx.fillStyle = "white";
ctx.fillText("Next Level", cameraX + 565, 352);
}

ctx.restore();
}
 
function game(){
if(!levelComplete){
update();
}
draw();
requestAnimationFrame(game);
}

game();
</script>
</body>
</html>
